---
layout: base
title: News
permalink: /
---

<article id="content">
  <div class="where">
    <p id="breadcrumb">
      <a href="/Website/" class="home">Home</a>
      &rsaquo; <a href="/Website/" class="last">Home</a>
    </p>
    <ul class="tabs clearfix news">
      <li class="selected">
        <a href="/Website/">News<span>&nbsp;</span></a>
      </li>
    </ul>
  </div>

  <div class="content home clearfix">
    <ul class="newslist">
{%- for post in news %}
      <li class="news">
        <span class="cat cat_{{ post.category }}"></span>
        <div class="inner">
          <h2><a href="{{ post.href }}">{{ post.title | escape }}</a></h2>
          <p class="date"><span>{{ post.date }}</span></p>
          <div class="text">
            {{ post.html }}
          </div>
        </div>
        <span class="bubble"></span>
      </li>
{%- endfor %}
    </ul>
  </div>
</article>
